<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap</title>
<style>
  :root{ --bg:#f4f4f5; --text:#18181b; --muted:#71717a; --accent:#18181b; --accent-text:#fff; color-scheme: light; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0b0b0d; --text:#f4f4f5; --muted:#a1a1aa; --accent:#f4f4f5; --accent-text:#0b0b0d; color-scheme: dark; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);
  }
  .card{ max-width:320px; width:100%; text-align:center; }
  button{
    appearance:none; border:none; border-radius:14px;
    background:var(--accent); color:var(--accent-text);
    font-size:1.1rem; font-weight:600; padding:18px 24px;
    width:100%; cursor:pointer;
  }
  .status{ color:var(--muted); font-size:0.9rem; margin-top:14px; min-height:1.2em; }
</style>
</head>
<body>
  <div class="card">
    <button id="goBtn">Tap</button>
    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ======= PASTE YOUR FIREBASE CONFIG HERE (same as display.html) =======
    const firebaseConfig = {
      apiKey: "AIzaSyDAYPEEc-e9m0xYBraWBw86JJfu0GR56Mc",
      databaseURL: "https://shock-v1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "shock-v1"
    };
    // =========================================================================

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const triggerRef = ref(db, "trigger");

    const btn = document.getElementById('goBtn');
    const statusEl = document.getElementById('status');

    btn.addEventListener('click', async () => {
      statusEl.textContent = 'sending…';
      try {
        await set(triggerRef, { ts: Date.now() });
        statusEl.textContent = 'sent ✓';
      } catch (e) {
        statusEl.textContent = 'failed: ' + e.message;
      }
    });
  </script>
</body>
</html>
